# Dependency contracts from architecture §22.1. A violation fails CI rather
# than quietly accumulating, which is the only reason the modular monolith
# stays extractable into services later (G4).
#
# Run: lint-imports --config importlinter.ini

[importlinter]
root_package = prag

# ---------------------------------------------------------------------------
# Contract 1: core imports nothing internal.
# This is the contract everything else rests on. core defines the protocols
# and domain models; if it acquires a dependency on an implementation, the
# dependency inversion that makes every other boundary work is gone.
# ---------------------------------------------------------------------------
[importlinter:contract:core-independent]
name = core depends on nothing internal
type = forbidden
source_modules =
    prag.core
forbidden_modules =
    prag.api
    prag.orchestration
    prag.intelligence
    prag.parametric
    prag.retrieval
    prag.evidence
    prag.context
    prag.fusion
    prag.generation
    prag.agents
    prag.memory
    prag.ingestion
    prag.knowledge
    prag.guardrails
    prag.evaluation
    prag.caching
    prag.observability
    prag.storage
    prag.config
    prag.workers

# ---------------------------------------------------------------------------
# Contract 2: storage is persistence only, no business logic.
# Enforced structurally: storage may reach core and nothing else. A repository
# that needs a decision made does not get to make it (§32.2 rule 6).
# ---------------------------------------------------------------------------
[importlinter:contract:storage-is-persistence-only]
name = storage imports only core
type = forbidden
source_modules =
    prag.storage
forbidden_modules =
    prag.api
    prag.orchestration
    prag.intelligence
    prag.parametric
    prag.retrieval
    prag.evidence
    prag.context
    prag.fusion
    prag.generation
    prag.agents
    prag.memory
    prag.ingestion
    prag.knowledge
    prag.guardrails
    prag.evaluation
    prag.caching
    prag.workers

# ---------------------------------------------------------------------------
# Contract 3: orchestration resolves protocols through the DI container and
# never imports a concrete subsystem implementation. This is what allows a
# node to be tested against a fake and a subsystem to move out of process.
# ---------------------------------------------------------------------------
[importlinter:contract:orchestration-protocols-only]
name = orchestration imports protocols, never implementations
type = forbidden
source_modules =
    prag.orchestration
forbidden_modules =
    prag.api
    prag.intelligence
    prag.parametric
    prag.retrieval
    prag.evidence
    prag.context
    prag.fusion
    prag.generation
    prag.agents
    prag.memory
    prag.ingestion
    prag.knowledge
    prag.guardrails
    prag.evaluation
    prag.caching
    prag.storage

# ---------------------------------------------------------------------------
# Contract 4: nothing imports api. The transport layer is a leaf; anything
# it needs to share belongs in core.
# ---------------------------------------------------------------------------
[importlinter:contract:api-is-a-leaf]
name = no package imports api
type = forbidden
source_modules =
    prag.orchestration
    prag.intelligence
    prag.parametric
    prag.retrieval
    prag.evidence
    prag.context
    prag.fusion
    prag.generation
    prag.agents
    prag.memory
    prag.ingestion
    prag.knowledge
    prag.guardrails
    prag.evaluation
    prag.caching
    prag.observability
    prag.storage
    prag.config
    prag.workers
forbidden_modules =
    prag.api

# ---------------------------------------------------------------------------
# Contract 5: the parametric tier and the retrieval tier stay independently
# disableable (§32.5). The system must remain fully useful with
# parametric.enabled = false, which it cannot be if the two are entangled.
# ---------------------------------------------------------------------------
[importlinter:contract:parametric-retrieval-independence]
name = parametric and retrieval are mutually independent
type = independence
modules =
    prag.parametric
    prag.retrieval

# ---------------------------------------------------------------------------
# Contract 6: per-package allowances from the §22.1 table, for the subsystems
# whose permitted imports are narrower than "core plus storage".
# ---------------------------------------------------------------------------
[importlinter:contract:leaf-subsystems]
name = intelligence, evidence, fusion, guardrails and observability import only core
type = forbidden
source_modules =
    prag.intelligence
    prag.evidence
    prag.fusion
    prag.guardrails
    prag.observability
forbidden_modules =
    prag.orchestration
    prag.parametric
    prag.retrieval
    prag.context
    prag.generation
    prag.agents
    prag.memory
    prag.ingestion
    prag.knowledge
    prag.caching
    prag.storage
    prag.workers
